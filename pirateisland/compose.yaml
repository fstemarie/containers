---

networks:
  lagoon:
    external: true
  greygoose:
    external: true

services:
  qb:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qb
    privileged: true
    environment:
      - PUID=897
      - PGID=899
      - TZ=America/Montreal
      - UMASK=022
      - WEBUI_PORT=80
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /l/containers/qbittorrent:/config
      - ./qb/notify.sh:/config/notify.sh
      - /d/ruby:/ruby
      - /d/ruby/torrents:/torrents
      - /d/ruby/downloads:/downloads
      - /d/emerald:/emerald
    networks:
      lagoon:
      greygoose:
        ipv4_address: 192.168.0.2
    healthcheck:
      test: curl --fail http://127.0.0.1/api/v2/app/version
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - falarie.groupby=pirateisland

  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    privileged: true
    env_file: apikeys.env
    environment:
      - PUID=896
      - PGID=899
      - TZ=America/Montreal
      - UMASK=022 #optional
      - DOCKER_MODS=linuxserver/mods:radarr-striptracks
      - STRIPTRACKS_ARGS=--audio :eng:fre --subs :eng:fre
    volumes:
      - /l/containers/radarr:/config
      - /l/backup/sklad/radarr:/config/Backups
      - ./radarr:/scripts
      - /d/emerald:/emerald
    networks:
      lagoon:
      greygoose:
        ipv4_address: 192.168.0.3
    healthcheck:
      test: curl --fail http://127.0.0.1/api/v3/health?apikey=$$RADARR_APIKEY
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 10s
    restart: unless-stopped
    labels:
      - falarie.groupby=pirateisland

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    privileged: true
    env_file: apikeys.env
    environment:
      - PUID=895
      - PGID=899
      - TZ=America/Montreal
      - UMASK=022 #optional
      - DOCKER_MODS=linuxserver/mods:radarr-striptracks
      - STRIPTRACKS_ARGS=--audio :eng:fre --subs :eng:fre
    volumes:
      - /l/containers/sonarr:/config
      - /l/backup/sklad/sonarr:/config/Backups
      - /d/emerald:/emerald
    networks:
      lagoon:
      greygoose:
        ipv4_address: 192.168.0.4
    healthcheck:
      test: curl --fail http://127.0.0.1/api/v3/health?apikey=$$SONARR_APIKEY
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 10s
    restart: unless-stopped
    labels:
      - falarie.groupby=pirateisland

  jackett:
    image: lscr.io/linuxserver/jackett
    container_name: jackett
    environment:
      - PUI=894
      - PGID=894
      - TZ=America/Montreal
      - AUTO_UPDATE=true
    volumes:
      - /l/containers/jackett:/config
      - /d/ruby/torrents:/torrents
    networks:
      lagoon:
      greygoose:
        ipv4_address: 192.168.0.5
    healthcheck:
      test: curl --fail http://127.0.0.1/UI/Dashboard
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 10s
    restart: unless-stopped
    labels:
      - falarie.groupby=pirateisland

  byparr: # Port 8191
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    environment:
      - TZ=America/Montreal
    volumes:
      - /dev/null:/app/screenshots # For screenshots when exception occurs
    networks:
      lagoon:
    healthcheck:
      test: curl --fail http://127.0.0.1:8191/health
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    restart: unless-stopped
    labels:
      - falarie.groupby=pirateisland

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    user: "1000:100"
    environment:
      - LOG_LEVEL=info
      - TZ=America/Montreal
      - PORT=80 #optional
    volumes:
      - /l/containers/seerr:/app/config
    networks:
      lagoon:
      greygoose:
        ipv4_address: 192.168.0.6
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost/api/v1/settings/public || exit 1
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    restart: unless-stopped
    labels:
      - falarie.groupby=pirateisland