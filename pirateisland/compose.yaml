---

networks:
  lagoon:
    external: true
  greygoose:
    external: true

services:
  qb:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qb
    privileged: true
    environment:
      - TZ=America/Montreal
      - PUID=897
      - PGID=899
      - UMASK=022
      - WEBUI_PORT=80
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /l/containers/qbittorrent:/config
      - ./qb/notify.sh:/config/notify.sh
      - /d/ruby:/ruby
      - /d/ruby/torrents:/torrents
      - /d/ruby/downloads:/downloads
      - /d/emerald:/emerald
    networks:
      lagoon:
      greygoose:
    dns:
      - 192.168.0.2
    healthcheck:
      test: curl --fail http://127.0.0.1/api/v2/app/version
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      falarie.groupby: pirateisland
      greygoose.hostname: qb_f
      tsdproxy.enable: true
      tsdproxy.port.1: "443/https:80/http"

  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    privileged: true
    env_file: apikeys.env
    environment:
      - TZ=America/Montreal
      - PUID=896
      - PGID=899
      - UMASK=022 #optional
      - DOCKER_MODS=linuxserver/mods:radarr-striptracks
      - STRIPTRACKS_ARGS=--audio :eng:fre --subs :eng:fre
    volumes:
      - /l/containers/radarr:/config
      - /l/backup/sklad/radarr:/config/Backups
      - ./radarr:/scripts
      - /d/emerald:/emerald
    networks:
      lagoon:
      greygoose:
    dns:
      - 192.168.0.2
    healthcheck:
      test: curl --fail http://127.0.0.1/api/v3/health?apikey=$$RADARR_APIKEY
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 10s
    restart: unless-stopped
    labels:
      falarie.groupby: pirateisland
      greygoose.hostname: radarr_f
      tsdproxy.enable: true
      tsdproxy.port.1: "443/https:80/http"

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    privileged: true
    env_file: apikeys.env
    environment:
      - TZ=America/Montreal
      - PUID=895
      - PGID=899
      - UMASK=022 #optional
      - DOCKER_MODS=linuxserver/mods:radarr-striptracks
      - STRIPTRACKS_ARGS=--audio :eng:fre --subs :eng:fre
    volumes:
      - /l/containers/sonarr:/config
      - /l/backup/sklad/sonarr:/config/Backups
      - /d/emerald:/emerald
    networks:
      lagoon:
      greygoose:
    dns:
      - 192.168.0.2
    healthcheck:
      test: curl --fail http://127.0.0.1/api/v3/health?apikey=$$SONARR_APIKEY
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 10s
    restart: unless-stopped
    labels:
      falarie.groupby: pirateisland
      greygoose.hostname: sonarr_f
      tsdproxy.enable: true
      tsdproxy.port.1: "443/https:80/http"

  jackett:
    image: lscr.io/linuxserver/jackett
    container_name: jackett
    environment:
      - TZ=America/Montreal
      - PUID=894
      - PGID=899
      - AUTO_UPDATE=true
    volumes:
      - /l/containers/jackett:/config
      - /d/ruby/torrents:/torrents
    networks:
      lagoon:
      greygoose:
    dns:
      - 192.168.0.2
    healthcheck:
      test: curl --fail http://127.0.0.1/UI/Dashboard
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 10s
    restart: unless-stopped
    labels:
      falarie.groupby: pirateisland
      tsdproxy.enable: true
      tsdproxy.port.1: "443/https:80/http"

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    user: "1000:100"
    environment:
      - TZ=America/Montreal
      - LOG_LEVEL=info
      - PORT=80 #optional
    volumes:
      - /l/containers/seerr:/app/config
    networks:
      lagoon:
      greygoose:
    dns:
      - 192.168.0.2
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1/api/v1/settings/public || exit 1
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    restart: unless-stopped
    labels:
      falarie.groupby: pirateisland
      greygoose.hostname: seerr_f
      tsdproxy.enable: true
      tsdproxy.port.1: "443/https:80/http"

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    volumes:
      - /data/containers/cleanuparr:/config
      - /d/emerald:/emerald
      - /d/ruby:/ruby
    environment:
      - PUID=892
      - PGID=899
      - PORT=80
    #   - BASE_PATH=
      - UMASK=022
      - TZ=America/Montreal
    networks:
      lagoon:
      greygoose:
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 30s        # Check every 30 seconds
      timeout: 10s         # Allow up to 10 seconds for response
      start_period: 30s    # Wait 30 seconds before first check
      retries: 3           # Mark unhealthy after 3 consecutive failures
    restart: unless-stopped
    labels:
      falarie.groupby: pirateisland
      tsdproxy.enable: true
      tsdproxy.port.1: "443/https:80/http"

  byparr: # Port 8191
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    environment:
      - TZ=America/Montreal
    volumes:
      - /dev/null:/app/screenshots # For screenshots when exception occurs
    networks:
      lagoon:
    healthcheck:
      test: curl --fail http://127.0.0.1:8191/health
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 10s
    restart: unless-stopped
    labels:
      falarie.groupby: pirateisland
