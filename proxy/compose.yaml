---

networks:
  lagoon:
    external: true
  greygoose:
    external: true

volumes:
  caddy_data:
  caddy_config:
  tsdproxy_ts:

services:
  caddy:
    image: serfriz/caddy-duckdns:latest
    container_name: caddy
    entrypoint: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    environment:
      - CADDY_ADMIN:2019
    volumes:
      - /l/containers/caddy/config:/etc/caddy
      - /l/containers/caddy/log:/var/log/caddy
      - caddy_config:/config
      - caddy_data:/data
    networks:
      lagoon:
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:2019/config/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    labels:
      - falarie.groupby=proxy

  tsdproxy:
    image: almeidapaulopt/tsdproxy
    container_name: tsdproxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/containers/tsdproxy:/config
      - tsdproxy_ts:/data
    networks:
      lagoon:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    labels:
      falarie.groupby: proxy
      tsdproxy.enable: "true"
      tsdproxy.name: "dash"
      tsdproxy.dash.visible: "true"
      tsdproxy.port.1: "443/https:8080/http"
