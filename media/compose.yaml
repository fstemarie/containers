---

networks:
  ocean:
    external: true
  lagoon:
    external: true

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    group_add: 
      - "105" # render
    environment:
      - PUID=898 # jellyfin
      - PGID=899
      - TZ=America/Toronto
      - JELLYFIN_PublishedServerUrl=http://10.0.1.65
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    tmpfs:
      - /config/data/transcoding-temp:size=16G,mode=1777 # create in RAM for transcodes
    volumes:
      - /l/containers/jellyfin:/config
      - /l/backup/sklad/jellyfin:/config/data/data/backups
      - /d/emerald:/emerald
      - /d/ruby/audio/files:/audio
    devices:
      - /dev/dri:/dev/drisudo /etc/init.d/
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    networks:
      lagoon:
      ocean:
        ipv4_address: 10.0.1.65
    # ports:
    #   - "8096:8096/tcp"
    #   - "7359:7359/udp"
    #   - "1900:1900/udp"
    deploy:   # this section is for NVIDIA support in newer docker-compose
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: curl -f http://127.0.0.1/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      falarie.groupby: media
      tsdproxy.enable: true
      tsdproxy.port.1: "443/https:80/http"
