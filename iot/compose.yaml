  nodered:
    image: nodered/node-red
    container_name: nodered
    user: "1000:100"
    env_file:
      - ~/secrets/nodered.env
    environment:
      - TZ=America/Montreal
      - NODE_RED_PORT=80
      - NODE_RED_HTTPADMINROOT=/
      - NODE_RED_HTTPNODEROOT=/www
    volumes:
      - /l/containers/nodered:/data
      - nrws:/workspace
      - /l/audio/podcasts/:/podcasts
    networks:
      lagoon:
        aliases: [nr]
      greygoose:
    dns: ["192.168.0.2"]
    healthcheck:
      test: curl -f http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    labels:
      falarie.groupby: iot
      tsdproxy.enable: true
      tsdproxy.port.1: "443/https:80/http"
