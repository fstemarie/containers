---

x-filebox-hosts: &filebox-hosts
  homeassistant: 192.168.0.129
  qb: 192.168.0.130
  radarr: 192.168.0.131
  sonarr: 192.168.0.132
  lidarr: 192.168.0.133
  prowlarr: 192.168.0.134
  byparr: 192.168.0.135
  tautulli: 192.168.0.136
  seerr: 192.168.0.137
  fileflows: 192.168.0.138

networks:
  lagoon:
    external: true
  greygoose:
    external: true

volumes:
  appdaemon:
  nrws:

services:
  appdaemon:
    image: acockburn/appdaemon:latest
    container_name: appdaemon
    user: "1000:100"
    environment:
      - TZ=America/Montreal
      - HA_URL=http://iot:80
      - TOKEN=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiIzMzMyM2Y5NGMyMjg0MzlhYmZkZGNhYzNkOTJmYWEwMiIsImlhdCI6MTczNTY5OTkxNSwiZXhwIjoyMDUxMDU5OTE1fQ.IbQOoigaz9q2UvnSZvmOKUUpO71WycXhrRpZaywLzfQ
      - HOME=/conf
    volumes:
      - /l/containers/appdaemon:/conf
      - /dev/null:/certs
    networks:
      lagoon:
      greygoose:
        ipv4_address: 192.168.0.7
    extra_hosts:
      <<: *filebox-hosts
    restart: unless-stopped
    labels:
      - falarie.groupby=iot

  nodered:
    image: nodered/node-red
    container_name: nodered
    user: "1000:100"
    healthcheck:
      start_period: 20s
      test: curl -f http://127.0.0.1/health.html || exit 1
      interval: 5m
      retries: 3
    env_file:
      - ~/secrets/nodered.env
    environment:
      - TZ=America/Montreal
      # - NODE_RED_HTTPADMINROOT=/admin
      # - NODE_RED_HTTPNODEROOT=/
      - NODE_RED_PORT=80
    volumes:
      - /l/containers/nodered:/data
      - nrws:/workspace
      - /l/audio/podcasts/:/podcasts
    networks:
      lagoon:
      greygoose:
        ipv4_address: 192.168.0.8
    extra_hosts:
      <<: *filebox-hosts
    restart: unless-stopped
    labels:
      - falarie.groupby=iot
